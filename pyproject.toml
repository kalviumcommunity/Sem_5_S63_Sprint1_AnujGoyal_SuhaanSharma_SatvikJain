[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-behaviour-analytics"
version = "0.1.0"
description = "Learning Behaviour & Course Completion Analytics"
authors = [
    { name = "Project Contributors" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "pytest>=7.4.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --verbose"
testpaths = [
    "tests"
]
pythonpath = ["."]
