name: Data Pipeline Validation

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project code
        run: python -m compileall -q src dashboard tests

      - name: Run full test suite
        run: python -m pytest

      - name: Run validation and pipeline checks
        run: python -m pytest tests/test_validation.py tests/test_ingestion.py tests/test_pipeline.py -q

      - name: Validate SQL schema and analytical views
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          connection = sqlite3.connect(":memory:")
          try:
              for sql_file in (Path("sql/schema.sql"), Path("sql/views.sql")):
                  connection.executescript(sql_file.read_text(encoding="utf-8"))
                  print(f"Validated {sql_file}")
          finally:
              connection.close()
          PY

      - name: Execute pipeline status check
        run: |
          python - <<'PY'
          from src.pipeline import run_pipeline

          result = run_pipeline(save_to_db=False, generate_outputs=False)
          if result.get("status") != "SUCCESS":
              raise SystemExit(f"Pipeline check failed: {result}")
          print(result.get("message", "Pipeline check passed."))
          PY
